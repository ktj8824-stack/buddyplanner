# buddyplanner.kr 웹사이트 자동 배포 (GitHub Pages)
# main에 코드가 올라오면 www 폴더를 새로 만들어 GitHub Pages에 올립니다.
# 필요한 설정 (한 번만):
#   1) Settings > Secrets and variables > Actions > New repository secret
#      이름: WEB_CONFIG_JS  /  값: 웹용 js/config.js 파일 내용 전체 (ADS_TEST_MODE·ADMIN_MODE는 false)
#   2) Settings > Pages > Source: GitHub Actions, Custom domain: buddyplanner.kr
name: Deploy web (buddyplanner.kr)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 웹용 설정 파일 만들기
        env:
          WEB_CONFIG_JS: ${{ secrets.WEB_CONFIG_JS }}
        run: |
          if [ -z "$WEB_CONFIG_JS" ]; then
            echo "::error::WEB_CONFIG_JS 시크릿이 없습니다. Settings > Secrets and variables > Actions에서 추가하세요."
            exit 1
          fi
          printf '%s\n' "$WEB_CONFIG_JS" > js/config.js
      - name: www 만들기
        run: node build.js
      - name: 도메인 파일
        run: echo "buddyplanner.kr" > www/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
