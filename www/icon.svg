<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04261a" />
      <stop offset="50%" stop-color="#0b1510" />
      <stop offset="100%" stop-color="#060d0a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a7b2e" />
      <stop offset="50%" stop-color="#d4bc6e" />
      <stop offset="100%" stop-color="#c8a951" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#22c987" stroke-width="8" />
  <!-- Golf Flag -->
  <g transform="translate(128, 96)">
    <!-- Flagpole -->
    <line x1="120" y1="320" x2="120" y2="40" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    <!-- Hole/Green Base -->
    <ellipse cx="120" cy="320" rx="60" ry="15" fill="#14a36e" opacity="0.4" />
    <ellipse cx="120" cy="320" rx="30" ry="8" fill="#04261a" />
    <!-- Flag -->
    <path d="M120,40 L240,90 L120,140 Z" fill="#ef4444" stroke="#ef4444" stroke-width="4" stroke-linejoin="round" />
    <!-- Golf Ball -->
    <circle cx="160" cy="315" r="14" fill="#ffffff" />
  </g>
</svg>
