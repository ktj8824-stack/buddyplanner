<!doctype html><html><body style="margin:0;background:transparent">
<canvas id="c" width="768" height="768"></canvas>
<script>
const COMMON = `#version 300 es
precision highp float;
out vec4 outColor;
uniform vec2 R;
uniform int SCENE;
// ---------- SDF ----------
float sdSphere(vec3 p, float r){ return length(p)-r; }
float sdRBox(vec3 p, vec3 b, float r){ vec3 q=abs(p)-b+r; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r; }
float sdCap(vec3 p, vec3 a, vec3 b, float r){ vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-r; }
float sdTorus(vec3 p, vec2 t){ vec2 q=vec2(length(p.xz)-t.x,p.y); return length(q)-t.y; }
float sdCyl(vec3 p, float h, float r, float rr){ vec2 d=vec2(length(p.xz)-r+rr, abs(p.y)-h+rr); return min(max(d.x,d.y),0.)+length(max(d,0.))-rr; }
float smin(float a,float b,float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }
mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
vec2 U(vec2 a, vec2 b){ return a.x<b.x?a:b; }
// material ids
// 1 white, 2 red, 3 gold, 4 green, 5 blue, 6 yellow, 7 dark, 8 teal, 9 purple, 10 orange, 11 brown soup, 12 wood, 13 skin, 14 cream, 15 lightgreen
vec2 scene(vec3 p){
  vec2 d=vec2(1e9,0.);
  if(SCENE==1){ // calendar + plus badge
    vec3 q=p-vec3(0.,.62,0.); q.xz=rot(.35)*q.xz;
    d=U(d,vec2(sdRBox(q-vec3(0.,-.06,0.),vec3(.62,.52,.16),.12),1.));
    d=U(d,vec2(sdRBox(q-vec3(0.,.38,0.),vec3(.64,.18,.18),.12),2.));
    for(int i=0;i<2;i++){ float x = i==0?-.32:.32; vec3 r=q-vec3(x,.6,0.); d=U(d,vec2(sdTorus(r.xzy,vec2(.1,.035)),3.)); }
    // grid bumps (dates)
    for(int j=0;j<2;j++) for(int i=0;i<3;i++){ vec3 r=q-vec3(-.3+.3*float(i),.05-.27*float(j),.16); d=U(d,vec2(sdRBox(r,vec3(.08,.07,.03),.03),(i==1&&j==0)?4.:14.)); }
    // plus badge
    vec3 b=p-vec3(.5,.28,.48);
    d=U(d,vec2(sdCyl(b.xzy,.09,.26,.08),4.));
    vec3 c=b-vec3(0.,0.,.09);
    d=U(d,vec2(min(sdRBox(c,vec3(.15,.045,.04),.03),sdRBox(c,vec3(.045,.15,.04),.03)),1.));
  } else if(SCENE==2){ // three people
    vec3 offs[3]; offs[0]=vec3(-.52,0.,-.1); offs[1]=vec3(.52,0.,-.1); offs[2]=vec3(0.,0.,.18);
    float sc[3]; sc[0]=.85; sc[1]=.85; sc[2]=1.;
    float mats[3]; mats[0]=5.; mats[1]=6.; mats[2]=4.;
    for(int i=0;i<3;i++){
      vec3 q=(p-offs[i])/sc[i];
      float body=sdCap(q,vec3(0.,.28,0.),vec3(0.,.42,0.),.27);
      body=max(body,-q.y+.02);
      float head=sdSphere(q-vec3(0.,.98,0.),.25);
      d=U(d,vec2(body*sc[i],mats[i]));
      d=U(d,vec2(head*sc[i],13.));
      // cap
      vec3 h=q-vec3(0.,1.07,0.);
      float cap=max(sdSphere(h,.25), -h.y+.0);
      float brim=sdCyl((h-vec3(0.,.0,.12)),.022,.2,.02);
      d=U(d,vec2(min(cap,brim)*sc[i],mats[i]==4.?1.:mats[i]));
      // eyes
      for(int e=0;e<2;e++){ float ex=e==0?-.08:.08; d=U(d,vec2(sdSphere(q-vec3(ex,.98,.23),.032)*sc[i],7.)); }
    }
  } else if(SCENE==3){ // stopwatch
    vec3 q=p-vec3(0.,.72,0.); q.xz=rot(.25)*q.xz;
    vec3 f=q; f.yz=rot(1.5708)*f.yz;
    d=U(d,vec2(sdCyl(f,.16,.62,.1),4.));
    d=U(d,vec2(sdCyl(f-vec3(0.,.12,0.),.06,.52,.04),1.));
    d=U(d,vec2(sdCyl(q-vec3(0.,.74,0.),.08,.1,.03),3.));
    d=U(d,vec2(sdRBox(q-vec3(0.,.66,0.),vec3(.16,.05,.09),.04),4.));
    vec3 s=q-vec3(.45,.5,0.); s.xy=rot(-.8)*s.xy; d=U(d,vec2(sdRBox(s,vec3(.07,.07,.07),.04),3.));
    vec3 h=q-vec3(0.,0.,.2);
    d=U(d,vec2(sdCap(h,vec3(0.),vec3(0.,.33,0.),.03),7.));
    d=U(d,vec2(sdCap(h,vec3(0.),vec3(.22,-.12,0.),.03),2.));
    d=U(d,vec2(sdCyl(h.xzy,.03,.06,.02),3.));
    for(int i=0;i<12;i++){ float a=float(i)*0.5236; vec3 t=h-vec3(sin(a)*.42,cos(a)*.42,0.); d=U(d,vec2(sdSphere(t, (i%3==0)?.035:.02),7.)); }
  } else if(SCENE==4){ // shopping bag
    vec3 q=p-vec3(0.,.6,0.); q.xz=rot(.4)*q.xz;
    float bag=sdRBox(q,vec3(.55,.55,.3),.1);
    bag=max(bag,-sdRBox(q-vec3(0.,.6,0.),vec3(.45,.1,.2),.05));
    d=U(d,vec2(bag,8.));
    for(int i=0;i<2;i++){ float z=i==0?-.15:.15; vec3 h=q-vec3(0.,.55,z); h.xy=h.xy; float t=length(vec2(length(h.xy)-.26,h.z))-.045; t=max(t,-h.y); d=U(d,vec2(t,3.)); }
    d=U(d,vec2(sdRBox(q-vec3(0.,.38,.3),vec3(.56,.05,.03),.02),1.));
    vec3 c=q-vec3(0.,-.05,.31); d=U(d,vec2(sdRBox(c,vec3(.17,.17,.03),.06),1.));
    d=U(d,vec2(sdSphere(c-vec3(0.,0.,.04),.07),3.));
  } else if(SCENE==5){ // chat bubbles
    vec3 q=p-vec3(-.15,.58,.15); q.xz=rot(.3)*q.xz;
    float big=sdRBox(q,vec3(.6,.42,.2),.2);
    big=smin(big, sdCap(q,vec3(-.32,-.35,0.),vec3(-.5,-.62,0.),.08),.08);
    d=U(d,vec2(big,9.));
    for(int i=0;i<3;i++){ d=U(d,vec2(sdSphere(q-vec3(-.28+.28*float(i),0.,.22),.075),1.)); }
    vec3 s=p-vec3(.62,1.22,-.25); s.xz=rot(.3)*s.xz;
    float sm=sdRBox(s,vec3(.36,.28,.16),.15);
    sm=smin(sm, sdCap(s,vec3(.22,-.2,0.),vec3(.36,-.4,0.),.06),.06);
    for(int i=0;i<2;i++){ d=U(d,vec2(sdRBox(s-vec3(-.02,.07-.14*float(i),.16),vec3(.2-.07*float(i),.025,.02),.02),9.)); }
    d=U(d,vec2(sm,14.));
  } else if(SCENE==6){ // bowl of soup with chopsticks
    vec3 q=p-vec3(0.,.55,0.);
    float outer=sdSphere(q,.72); float inner=sdSphere(q-vec3(0.,.04,0.),.64);
    float bowl=max(max(outer,-inner),q.y-.02);
    bowl=min(bowl, sdCyl(q-vec3(0.,-.66,0.),.06,.3,.04));
    d=U(d,vec2(bowl,10.));
    d=U(d,vec2(sdCyl(q-vec3(0.,-.06,0.),.02,.62,.02),11.));
    for(int i=0;i<5;i++){ float a=float(i)*1.25664+.4; vec3 g=q-vec3(cos(a)*.3,-.03,sin(a)*.3); d=U(d,vec2(sdSphere(g,.07),i==2?14.:15.)); }
    d=U(d,vec2(sdRBox(q-vec3(-.08,-.02,.12),vec3(.16,.03,.09),.03),14.));
    d=U(d,vec2(sdCap(q,vec3(-.1,.05,-.1),vec3(.85,.62,-.45),.03),12.));
    d=U(d,vec2(sdCap(q,vec3(-.05,.05,0.),vec3(.9,.6,-.28),.03),12.));
  } else if(SCENE==7){ // gift box
    vec3 q=p-vec3(0.,.5,0.); q.xz=rot(.5)*q.xz;
    d=U(d,vec2(sdRBox(q,vec3(.55,.45,.55),.08),9.));
    d=U(d,vec2(sdRBox(q-vec3(0.,.5,0.),vec3(.62,.1,.62),.06),9.));
    d=U(d,vec2(sdRBox(q-vec3(0.,.05,0.),vec3(.12,.56,.57),.04),3.));
    d=U(d,vec2(sdRBox(q-vec3(0.,.05,0.),vec3(.57,.56,.12),.04),3.));
    vec3 b=q-vec3(0.,.66,0.);
    for(int i=0;i<2;i++){ vec3 r=b; r.x*= i==0?1.:-1.; r-=vec3(.18,.08,0.); r.xy=rot(.5)*r.xy; d=U(d,vec2(sdTorus(r.xzy*vec3(1.,1.,1.),vec2(.14,.05)),3.)); }
    d=U(d,vec2(sdSphere(b-vec3(0.,.06,0.),.09),3.));
  }
  return d;
}
vec3 matCol(float m, out float rough, out float metal){
  rough=.45; metal=0.;
  if(m<1.5) return vec3(.97,.97,.96);
  if(m<2.5) return vec3(.93,.25,.25);
  if(m<3.5){ rough=.25; metal=1.; return vec3(1.,.78,.34); }
  if(m<4.5) return vec3(.13,.62,.33);
  if(m<5.5) return vec3(.25,.55,.95);
  if(m<6.5) return vec3(1.,.8,.25);
  if(m<7.5) return vec3(.12,.14,.2);
  if(m<8.5) return vec3(.1,.72,.78);
  if(m<9.5) return vec3(.62,.42,.95);
  if(m<10.5) return vec3(1.,.55,.2);
  if(m<11.5){ rough=.2; return vec3(.72,.38,.16); }
  if(m<12.5) return vec3(.82,.6,.36);
  if(m<13.5) return vec3(1.,.82,.68);
  if(m<14.5) return vec3(1.,.95,.84);
  return vec3(.5,.85,.4);
}
vec3 nrm(vec3 p){ vec2 e=vec2(.0008,0.); return normalize(vec3(scene(p+e.xyy).x-scene(p-e.xyy).x, scene(p+e.yxy).x-scene(p-e.yxy).x, scene(p+e.yyx).x-scene(p-e.yyx).x)); }
float shadow(vec3 ro, vec3 rd){ float res=1., t=.02; for(int i=0;i<64;i++){ float h=scene(ro+rd*t).x; res=min(res,10.*h/t); t+=clamp(h,.01,.2); if(res<.001||t>6.) break; } return clamp(res,0.,1.); }
float ao(vec3 p, vec3 n){ float o=0., s=1.; for(int i=1;i<=6;i++){ float h=.04*float(i); o+=(h-scene(p+n*h).x)*s; s*=.75; } return clamp(1.-2.2*o,0.,1.); }
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;
  vec3 ro=vec3(0.,1.55,4.6), ta=vec3(0.,.62,0.);
  vec3 ww=normalize(ta-ro), uu=normalize(cross(ww,vec3(0.,1.,0.))), vv=cross(uu,ww);
  vec3 rd=normalize(uv.x*uu+uv.y*vv+2.05*ww);
  float t=0.; vec2 h; bool hit=false;
  for(int i=0;i<220;i++){ h=scene(ro+rd*t); if(h.x<.0006){hit=true;break;} t+=h.x*.9; if(t>12.) break; }
  vec3 L=normalize(vec3(-.55,.9,.6));
  if(hit){
    vec3 p=ro+rd*t, n=nrm(p); float rough, metal; vec3 base=matCol(h.y,rough,metal);
    float sh=shadow(p+n*.002,L), occ=ao(p,n);
    float dif=clamp(dot(n,L),0.,1.);
    float wrap=clamp((dot(n,L)+.45)/1.45,0.,1.);
    vec3 H=normalize(L-rd); float spe=pow(clamp(dot(n,H),0.,1.), mix(120.,18.,rough));
    float fre=pow(1.-clamp(dot(n,-rd),0.,1.),4.);
    vec3 sky=mix(vec3(.75,.8,.9),vec3(1.),clamp(n.y*.5+.5,0.,1.));
    vec3 col;
    // 부드러운 조명: 그림자·반짝임을 줄이고 색을 파스텔 쪽으로
    base=mix(base, vec3(1.), .18);
    float soft=mix(.72,1.,sh);
    if(metal>.5){
      base=mix(base, vec3(.95,.82,.55), .35);
      col=base*(.62+.38*wrap*soft)*mix(.85,1.,occ) + vec3(1.,.97,.9)*spe*.25*sh;
    } else {
      col=base*(.58*mix(.88,1.,occ) + .48*wrap*soft);
      col+= vec3(1.)*spe*.12*sh*(1.-rough*.6);
      col+= vec3(1.)*fre*.10;
    }
    col=mix(col, vec3(dot(col,vec3(.299,.587,.114))), .08);
    col=pow(col,vec3(.92));
    outColor=vec4(col,1.);
  } else {
    // 바닥 그림자만 (투명 배경)
    if(rd.y<0.){ float tg=-ro.y/rd.y; vec3 g=ro+rd*tg; float s=shadow(g+vec3(0.,.001,0.),normalize(vec3(-.2,1.,.25))); float o=ao(g,vec3(0.,1.,0.));
      float a=(1.-s)*.10+(1.-o)*.22; a*=smoothstep(2.2,.6,length(g.xz));
      outColor=vec4(vec3(.1,.12,.2)*a,a); }
    else outColor=vec4(0.);
  }
}`;
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;
window.renderIcon = (scene) => {
  const c = document.getElementById('c');
  const gl = c.getContext('webgl2', { preserveDrawingBuffer: true, premultipliedAlpha: true, alpha: true, antialias: false });
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, COMMON)); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  gl.useProgram(pr);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(gl.getUniformLocation(pr, 'R'), c.width, c.height);
  gl.uniform1i(gl.getUniformLocation(pr, 'SCENE'), scene);
  gl.viewport(0, 0, c.width, c.height); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish();
  return c.toDataURL('image/png');
};
</script></body></html>
